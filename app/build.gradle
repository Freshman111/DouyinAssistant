plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.didi.drouter'
}

// 1. 定义一个 Properties 对象
def localProperties = new Properties()

// 2. 检查 local.properties 文件是否存在，如果存在则加载
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

android {
    compileSdk androidVersion.compileSdkVersion

    defaultConfig {
        applicationId "com.sgffsg.douyin.assist"
        minSdk androidVersion.minSdkVersion
        targetSdk androidVersion.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndkVersion = "25.2.9519653"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Signing is optional for an open-source checkout. If a local keystore and
    // password exist, use them for both debug and release so existing installs
    // keep updating; otherwise fall back to the default debug signing.
    def signingKeystore = rootProject.file('sign/douyin-assist-key.jks')
    def signingPassword = localProperties.getProperty('sign_pasword')
    def hasCustomSigning = signingKeystore.exists() &&
            signingPassword != null && !signingPassword.trim().isEmpty()

    signingConfigs {
        if (hasCustomSigning) {
            debug {
                storeFile signingKeystore
                storePassword signingPassword
                keyAlias 'douyin-assist-alias'
                keyPassword signingPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
            release {
                storeFile signingKeystore
                storePassword signingPassword
                keyAlias 'douyin-assist-alias'
                keyPassword signingPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            if (hasCustomSigning) {
                signingConfig signingConfigs.release
            } else {
                // Still produce an installable APK for local testing. Replace this
                // with your own release key before distributing a build.
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
    }
    def voiceAssets = project.findProperty("voiceExperimentAssets")
    if (voiceAssets != null) {
        sourceSets.debug.assets.srcDir(file(voiceAssets))
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    def paging_version = "3.0.1"


    //noinspection GradleDependency
    implementation "androidx.paging:paging-runtime:$paging_version"
    // 用于测试
    //noinspection GradleDependency
    testImplementation "androidx.paging:paging-common:$paging_version"
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.3'

    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation project(':biz-asr')
    implementation project(':biz-kws')
    implementation project(':biz-overlay')
    implementation project(':common')
    implementation project(':router-asr')
}
