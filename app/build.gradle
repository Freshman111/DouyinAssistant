plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// 1. 定义一个 Properties 对象
def localProperties = new Properties()

// 2. 检查 local.properties 文件是否存在，如果存在则加载
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

android {
    compileSdk androidVersion.compileSdkVersion

    defaultConfig {
        applicationId "com.sgffsg.douyin.assist"
        minSdk androidVersion.minSdkVersion
        targetSdk androidVersion.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndkVersion = "25.2.9519653"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            storeFile file("$rootProject.projectDir/sign/douyin-assist-key.jks")
            storePassword localProperties.getProperty('sign_pasword')
            keyAlias 'douyin-assist-alias'
            keyPassword localProperties.getProperty('sign_pasword')
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            storeFile file("$rootProject.projectDir/sign/douyin-assist-key.jks")
            storePassword localProperties.getProperty('sign_pasword')
            keyAlias 'douyin-assist-alias'
            keyPassword localProperties.getProperty('sign_pasword')
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    def paging_version = "3.0.1"


    //noinspection GradleDependency
    implementation "androidx.paging:paging-runtime:$paging_version"
    // 用于测试
    //noinspection GradleDependency
    testImplementation "androidx.paging:paging-common:$paging_version"
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.3'

    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation project(':biz-asr')
    implementation project(':biz-overlay')
    implementation project(':common')
}